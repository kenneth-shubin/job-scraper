<section id="scraper-status" class="run-bar"
         hx-get="/status/summary"
         hx-trigger="every 15s"
         hx-swap="outerHTML">
  <p>Last checked: {{ last_checked }}</p>
  <p>New jobs found: {{ new_jobs }}</p>
  {% if run_message %}<p class="notice">{{ run_message }}</p>{% endif %}
  <form method="post" action="/jobs/run" hx-post="/jobs/run" hx-target="#scraper-status" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Check for jobs</button>
  </form>
</section>
