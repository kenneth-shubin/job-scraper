{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Jobs</h1>
  {% include "status_summary.html" %}
  <form id="job-filters" class="filters" method="get" action="/"
        hx-get="/jobs/rows"
        hx-target="#job-table"
        hx-trigger="change, submit"
        hx-push-url="false">
    <label>Source
      <select name="source">
        <option value="">All sources</option>
        {% for name in sources %}
        <option value="{{ name }}" {% if source == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Application
      <select name="application">
        <option value="all" {% if application == "all" %}selected{% endif %}>All jobs</option>
        <option value="direct" {% if application == "direct" %}selected{% endif %}>Direct application available</option>
        <option value="job_board" {% if application == "job_board" %}selected{% endif %}>Job board only</option>
      </select>
    </label>
    <label>Show
      <select name="posted">
        <option value="24h" {% if posted == "24h" %}selected{% endif %}>Last 24 hours</option>
        <option value="3d" {% if posted == "3d" %}selected{% endif %}>Last 3 days</option>
      </select>
    </label>
    <label>Search
      <input type="search" name="q" value="{{ query }}" placeholder="Title, company, or description">
    </label>
    <button type="submit">Apply</button>
  </form>
  <div id="job-table"
       hx-get="/jobs/rows"
       hx-include="#job-filters"
       hx-trigger="refreshJobs from:body"
       hx-swap="innerHTML">
    {% include "jobs_rows.html" %}
  </div>
</section>
{% endblock %}
