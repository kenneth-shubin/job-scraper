{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Jobs</h1>
  <form class="filters" method="get" action="/"
        hx-get="/jobs/rows"
        hx-target="#job-table"
        hx-trigger="change, submit"
        hx-push-url="false">
    <label>Eligibility
      <select name="eligibility">
        {% for value in ["accepted", "rejected", "maybe", "all"] %}
        <option value="{{ value }}" {% if eligibility == value %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Source
      <select name="source">
        <option value="">All sources</option>
        {% for name in sources %}
        <option value="{{ name }}" {% if source == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Search
      <input type="search" name="q" value="{{ query }}" placeholder="Title, company, or description">
    </label>
    <button type="submit">Apply</button>
  </form>
  <div id="job-table">
    {% include "jobs_rows.html" %}
  </div>
</section>
{% endblock %}
