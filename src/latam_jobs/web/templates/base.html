<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · LATAM jobs</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="top">
    <p class="brand">LATAM jobs</p>
    <nav>
      <a href="/">Jobs</a>
      <a href="/settings">Settings</a>
      {% if csrf_token is defined %}
      {% if not login_page %}
      <div id="alert-bell" class="alert-bell" hx-get="/alerts/bell" hx-trigger="load" hx-swap="outerHTML"></div>
      {% endif %}
      <form method="post" action="/logout" class="logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Logout</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if csrf_token is defined and not login_page %}<script src="/static/alerts.js" defer></script>{% endif %}
</body>
</html>
