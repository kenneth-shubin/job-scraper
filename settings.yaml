residence_country: colombia
display_timezone: America/Bogota
remote_only: true

keywords:
  - full stack
  - full-stack
  - fullstack
  - software engineer
  - product engineer
  - web developer
  - frontend
  - front-end
  - front end
  - backend
  - back-end
  - back end
  - shopify
  - e-commerce
  - ecommerce
  - react
  - next.js
  - node.js
  - nestjs
  - typescript
  - graphql
  - python
  - django
  - data engineer
  - data engineering
  - analytics engineer
  - data analyst
  - data architect
  - data platform
  - etl
  - elt
  - airflow
  - dbt
  - spark
  - desarrollador
  - ingeniero de software
  - ingeniero de datos
  - analista de datos

exclude_keywords:
  - account executive
  - sales representative
  - marketing manager
  - recruiter
  - trainee
  - clearance

eligibility:
  accepted_only_notifications: true
  include_maybe_in_storage: true
  store_rejected: true

scheduler:
  check_interval_minutes: 60
  jitter_seconds: 120

http:
  timeout_seconds: 20
  max_retries: 2

database:
  path: data/latam-jobs.sqlite

web:
  host: 127.0.0.1
  port: 8080

notifications:
  enabled: false

ats_catalog:
  update_online: true

sources:
  remotive:
    enabled: true
    interval_hours: 12
    url: https://remotive.com/api/remote-jobs
    max_pages: 1

  himalayas:
    enabled: true
    interval_hours: 24
    url: https://himalayas.app/jobs/api/search
    max_pages: 5

  getonboard:
    enabled: true
    interval_hours: 24
    url: https://www.getonbrd.com/api/v0/categories/programming/jobs
    max_pages: 3

  wwr:
    enabled: true
    interval_hours: 12
    url: https://weworkremotely.com/categories/remote-programming-jobs.rss
    max_pages: 1
    feeds:
      - https://weworkremotely.com/categories/remote-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss

  remoteok:
    enabled: false
    interval_hours: 24
    url: https://remoteok.com/api
    max_pages: 1

  jobicy:
    enabled: true
    interval_hours: 12
    url: https://jobicy.com/api/v2/remote-jobs
    max_pages: 2

  arbeitnow:
    enabled: true
    interval_hours: 12
    url: https://www.arbeitnow.com/api/job-board-api
    max_pages: 1

  greenhouse:
    enabled: true
    interval_hours: 24
    url: https://boards-api.greenhouse.io/v1/boards/{board}/jobs
    max_pages: 1

  lever:
    enabled: true
    interval_hours: 24
    url: https://api.lever.co/v0/postings/{site}
    max_pages: 1

  ashby:
    enabled: true
    interval_hours: 24
    url: https://api.ashbyhq.com/posting-api/job-board/{board}
    max_pages: 1
